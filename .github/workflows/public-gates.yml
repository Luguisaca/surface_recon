name: Public Gates
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  public-surface:
    name: public-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python tools/public_surface_gate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python tools/public_policy_gate.py
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade build
      - run: python -m build
  portability:
    name: portability-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: surface-recon --help
