name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: portability-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Regression tests
        run: uv run --locked python -B -m pytest -q -p no:cacheprovider
      - name: CLI help
        run: uv run --locked python -m surface_recon --help
      - name: Local server help
        run: uv run --locked python -m surface_recon serve --help
      - name: Build wheel
        run: uv build --wheel
      - name: Linux installer syntax
        if: runner.os == 'Linux'
        run: bash -n tools/install_linux.sh
